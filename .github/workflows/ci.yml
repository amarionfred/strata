name: ci

on:
  push:
    branches: [main, fork/android-linux]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Unit tests only: a full build needs proot, built by scripts/fetch-proot.sh.
      - name: Test
        run: ./gradlew :owl:test :app:testDebugUnitTest :owl:owlJar

      - name: Native preview
        run: ./gradlew -p system/companion assembleDebug testDebugUnitTest lintDebug
